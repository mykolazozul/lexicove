[package]
name = "lexicove"
version = "0.1.0"
description = "Lexicove desktop app"
authors = ["Lexicove contributors"]
license = "MIT"
repository = "https://github.com/mykolazozul/lexicove"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "lexicove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
