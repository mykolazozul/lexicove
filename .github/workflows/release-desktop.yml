name: Desktop release

# Push a tag like v0.3.0 (the same as "version" in src-tauri/tauri.conf.json) to build the
# installers for Windows, macOS and Linux and publish them as the latest GitHub Release.
# Installed apps find the new version through latest.json and update themselves.
# See docs/desktop.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # One draft release first, so the three builds don't race to create it.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Lexicove $TAG" \
            --notes "Windows: download Lexicove-Setup.exe and run it. Installed apps update themselves."
          echo "id=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Update files are signed only when the signing key is set up (docs/desktop.md).
      - name: Signed updates
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ] && [ -s src-tauri/updater-key.pub ]; then
            # The bundler checks the signature against the public key in the config, so add it there.
            node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.updater.conf.json','utf8'));c.plugins={updater:{pubkey:fs.readFileSync('src-tauri/updater-key.pub','utf8').trim()}};fs.writeFileSync('src-tauri/tauri.updater.conf.json',JSON.stringify(c))"
            echo "UPDATER_ARGS=--config ${{ github.workspace }}/src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "::warning::No update signing key: this release installs, but installed apps won't update to it."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}

      # The same file under a name without the version, so one link always gets the newest:
      # https://github.com/mykolazozul/lexicove/releases/latest/download/Lexicove-Setup.exe
      - name: Lexicove-Setup.exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          cp "$exe" Lexicove-Setup.exe
          gh release upload "$TAG" Lexicove-Setup.exe --clobber -R "$GITHUB_REPOSITORY"

  # Everything is uploaded: make it the latest release, which is what installed apps look at.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
