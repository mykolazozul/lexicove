<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lexicove: a cove (the bay) holding a word like a small boat. Flat, one colour. The mark stays
       inside the central safe zone, so phone launchers can crop the icon to any shape. -->
  <rect width="512" height="512" rx="116" fill="#8B5CF6"/>
  <path d="M140 214 A116 116 0 0 0 372 214" fill="none" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round"/>
  <circle cx="256" cy="200" r="36" fill="#FFFFFF"/>
</svg>
